site_name: AstraTerra
site_description: Player and developer documentation for the AstraTerra Vintage Story mod.
site_url: https://lalmei.github.io/astraterra/
repo_url: https://github.com/lalmei/astraterra
repo_name: lalmei/astraterra
docs_dir: docs
site_dir: site
exclude_docs: |
  README.md
  dev/README.md

theme:
  name: materialx
  language: en
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Player:
      - Guide: player/guide.md
      - Commands: player/commands.md
  - Developer:
      - Guide: dev/index.md
      - Architecture: dev/architecture.md
      - Data Pipeline: dev/data-pipeline.md
      - Manual Verification: dev/manual-verification.md
      - Product Scope: dev/product-scope.md
      - Reference Sky Notes: dev/reference-sky-rendering-notes.md
