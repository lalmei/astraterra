name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  VINTAGE_STORY_VERSION: 1.22.2
  VINTAGE_STORY_ARCHIVE_URL: https://cdn.vintagestory.at/gamefiles/stable/vs_client_linux-x64_1.22.2.tar.gz

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Linux
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # The mod and its tests compile against the shipped game assemblies, so CI needs
      # the Linux client next to the checkout. Only the DLLs are used; nothing is run.
      - name: Install Vintage Story references
        uses: ./.github/actions/vintage-story-refs
        with:
          version: ${{ env.VINTAGE_STORY_VERSION }}
          archive-url: ${{ env.VINTAGE_STORY_ARCHIVE_URL }}

      - name: Run tests
        run: make test TEST_ARGS="--logger trx --results-directory TestResults"

      - name: Build mod
        run: make build

      - name: Package mod
        run: make package

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-linux
          path: TestResults/*.trx
          if-no-files-found: warn

  benchmark:
    name: Near-body light cache benchmark
    # Beside the tests rather than inside them, and on its own runner: this is a separate claim
    # about repeated work, and it should fail as its own red mark instead of hiding among a
    # thousand unit tests. Nothing here wants the self-hosted Mac -- the references are managed
    # DLLs and the workload is arithmetic.
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Vintage Story references
        uses: ./.github/actions/vintage-story-refs
        with:
          version: ${{ env.VINTAGE_STORY_VERSION }}
          archive-url: ${{ env.VINTAGE_STORY_ARCHIVE_URL }}

      # Asserts computation counts and the checksum both paths agree on -- never a duration,
      # which on a shared runner would measure the neighbours.
      - name: Run the benchmark
        run: make bench
