name: Vintage Story references
description: >
  Installs .NET and the Vintage Story assemblies this mod compiles against, and exports
  VINTAGE_STORY for the build. The client archive is the linux-x64 one on every runner: the
  references are managed DLLs, so the host platform does not come into it.

inputs:
  version:
    description: Vintage Story version, used as the cache key.
    required: true
  archive-url:
    description: Where to fetch the client archive when the cache misses.
    required: true

runs:
  using: composite
  steps:
    - name: Set up .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Cache Vintage Story client
      uses: actions/cache@v6
      with:
        path: .vintagestory
        key: vintagestory-${{ runner.os }}-${{ inputs.version }}

    - name: Install Vintage Story references
      shell: bash
      env:
        ARCHIVE_URL: ${{ inputs.archive-url }}
      run: |
        if [[ ! -d "$GITHUB_WORKSPACE/.vintagestory" ]] || ! find "$GITHUB_WORKSPACE/.vintagestory" -name VintagestoryAPI.dll -type f | grep -q .; then
          mkdir -p "$GITHUB_WORKSPACE/.vintagestory" "$RUNNER_TEMP/vintagestory"
          curl -fL "$ARCHIVE_URL" -o "$RUNNER_TEMP/vintagestory/vintagestory.tar.gz"
          tar -xzf "$RUNNER_TEMP/vintagestory/vintagestory.tar.gz" -C "$GITHUB_WORKSPACE/.vintagestory"
        fi

        vintagestory_api="$(find "$GITHUB_WORKSPACE/.vintagestory" -name VintagestoryAPI.dll -type f | head -n 1)"
        if [[ -z "$vintagestory_api" ]]; then
          echo "Could not find VintagestoryAPI.dll after extracting Vintage Story." >&2
          exit 1
        fi

        echo "VINTAGE_STORY=$(dirname "$vintagestory_api")" >> "$GITHUB_ENV"
